# Ví dụ nginx trên VPS: HTTPS -> coin-web (chỉ lắng nghe 127.0.0.1:WEB_PORT).
# Thay coin.example.com và WEB_PORT; cấp chứng chỉ bằng certbot. Đăng nhập ứng dụng chỉ có mật khẩu,
# nên nên thêm một lớp nữa (allow IP của bạn, hoặc basic auth/VPN) vì giao diện này điều khiển tiền thật.
server {
    listen 443 ssl http2;
    server_name coin.example.com;
    ssl_certificate     /etc/letsencrypt/live/coin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coin.example.com/privkey.pem;

    # allow 203.0.113.10;   # IP của bạn
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:WEB_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
server { listen 80; server_name coin.example.com; return 301 https://$host$request_uri; }
